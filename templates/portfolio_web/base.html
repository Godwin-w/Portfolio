{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio | Python/Django Developer{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    
    <!-- Force transparent background -->
    <style>
        html, body {
            background-color: transparent !important;
            background: transparent !important;
            margin: 0;
            padding: 0;
        }

        :root {
    --primary-color: #00ff88;
    --secondary-color: #ff0066;
    --dark-bg: #000000;
    --glass-bg: rgba(0, 0, 0, 0.7);
    --glass-border: rgba(0, 255, 136, 0.2);
    --text-primary: #ffffff;
    --text-secondary: #e0e0e0;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    background-color: #000000 !important;
    background: #000000 !important;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Poppins', sans-serif;
    background-color: #000000 !important;
    background: #000000 !important;
    color: var(--text-primary);
    overflow-x: hidden;
    position: relative;
    min-height: 100vh;
}

/* Particle Background - Black with Green Particles */
#particles-js {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: 0;
    background-color: #000000 !important;
    background: #000000 !important;
}

#particles-js canvas {
    position: absolute;
    top: 0;
    left: 0;
    display: block;
    background-color: #000000 !important;
}

/* Navigation */
.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.95) !important;
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(0, 255, 136, 0.3);
    animation: slideDown 0.5s ease;
}

@keyframes slideDown {
    from {
        transform: translateY(-100%);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo a {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--primary-color);
    text-decoration: none;
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
}

.nav-links {
    display: flex;
    list-style: none;
    gap: 2rem;
}

.nav-links a {
    color: var(--text-primary);
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s ease;
    position: relative;
}

.nav-links a::before {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--primary-color);
    transition: width 0.3s ease;
    box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
}

.nav-links a:hover::before,
.nav-links a.active::before {
    width: 100%;
}

.nav-links a:hover {
    color: var(--primary-color);
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
}

/* Page Transitions */
.page-content {
    animation: fadeInUp 0.6s ease;
    background-color: transparent;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Hero Section */
.hero-section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background: transparent !important;
    z-index: 1;
}

.hero-content {
    text-align: center;
    z-index: 2;
    padding: 2rem;
    background: transparent;
}

.hero-content h1 {
    font-size: 3.5rem;
    margin-bottom: 1rem;
    color: #ffffff;
    text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
}

.glow-text {
    animation: glow 2s ease-in-out infinite;
}

.highlight {
    color: var(--primary-color);
    text-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
}

.typing-title {
    font-size: 2rem;
    margin-bottom: 1.5rem;
    color: var(--primary-color);
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
}

.hero-description {
    font-size: 1.1rem;
    max-width: 600px;
    margin: 0 auto 2rem;
    color: var(--text-secondary);
}

/* Buttons */
.cta-buttons {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
}

.btn {
    padding: 0.8rem 1.5rem;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    position: relative;
    overflow: hidden;
}

.btn-primary {
    background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
    color: #000000;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
}

.btn-secondary {
    background: rgba(0, 0, 0, 0.8);
    border: 1px solid var(--primary-color);
    color: #ffffff;
    box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
}

.btn-secondary:hover {
    background: rgba(0, 255, 136, 0.1);
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
}

.btn-tertiary {
    background: transparent;
    border: 1px solid var(--primary-color);
    color: #ffffff;
}

.btn-tertiary:hover {
    background: var(--primary-color);
    color: #000000;
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
}

/* Floating Elements - Green Glow */
.floating-elements {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
}

.float-element {
    position: absolute;
    font-size: 2rem;
    animation: float 6s ease-in-out infinite;
    opacity: 0.8;
    color: #00ff88;
    filter: drop-shadow(0 0 15px rgba(0, 255, 136, 0.8));
    transition: all 0.3s ease;
}

.float-element:nth-child(even) {
    color: #ff0066;
    filter: drop-shadow(0 0 15px rgba(255, 0, 102, 0.8));
    animation-delay: 1s;
}

.float-element:hover {
    transform: scale(1.3) !important;
    opacity: 1;
    filter: drop-shadow(0 0 25px rgba(0, 255, 136, 1));
}

@keyframes float {
    0%, 100% {
        transform: translateY(0px) rotate(0deg);
        opacity: 0.6;
    }
    50% {
        transform: translateY(-30px) rotate(180deg);
        opacity: 1;
    }
}

/* Projects Grid */
.projects-section {
    padding: 80px 0;
    background: transparent !important;
    position: relative;
    z-index: 1;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem;
}

.section-title {
    text-align: center;
    font-size: 2.5rem;
    margin-bottom: 3rem;
    color: var(--primary-color);
    text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
}

.projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 2rem;
}

.project-card {
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    overflow: hidden;
    transition: all 0.3s ease;
    border: 1px solid rgba(0, 255, 136, 0.3);
}

.project-card:hover {
    transform: translateY(-10px);
    box-shadow: 0 20px 40px rgba(0, 255, 136, 0.3);
    border-color: var(--primary-color);
}

.project-image {
    position: relative;
    overflow: hidden;
    height: 250px;
}

.project-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
}

.project-card:hover .project-image img {
    transform: scale(1.1);
}

.project-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.project-card:hover .project-overlay {
    opacity: 1;
}

.project-links {
    display: flex;
    gap: 1rem;
}

.project-links a {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--primary-color);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #000000;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
}

.project-links a:hover {
    transform: scale(1.1);
    box-shadow: 0 0 25px rgba(0, 255, 136, 0.8);
}

.project-info {
    padding: 1.5rem;
}

.project-info h3 {
    margin-bottom: 0.5rem;
    color: #ffffff;
}

.project-info p {
    color: var(--text-secondary);
    margin-bottom: 1rem;
}

.project-tech {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
}

.tech-tag {
    background: rgba(0, 255, 136, 0.2);
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    font-size: 0.8rem;
    color: var(--primary-color);
    border: 1px solid rgba(0, 255, 136, 0.3);
}

/* Skills Section */
/* .skills-section {
    padding: 80px 0;
    background: transparent !important;
    position: relative;
    z-index: 1;
} */

.skills-categories {
    display: flex;
    flex-direction: column;
    gap: 3rem;
}

.skill-category {
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 2rem;
    border: 1px solid rgba(0, 255, 136, 0.3);
}

.skill-category h3 {
    margin-bottom: 1.5rem;
    color: var(--primary-color);
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
}

.skill-item {
    margin-bottom: 1.5rem;
}

.skill-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.5rem;
    color: #ffffff;
}

.skill-name {
    color: #ffffff;
}

.skill-percentage {
    color: var(--primary-color);
}

.progress-bar {
    background: rgba(255, 255, 255, 0.1);
    height: 10px;
    border-radius: 5px;
    overflow: hidden;
}

.progress {
    background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
    height: 100%;
    border-radius: 5px;
    transition: width 1s ease;
    box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
}

.circular-skills {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 2rem;
    justify-items: center;
}

.circular-skill {
    text-align: center;
}

.circular-skill .skill-name {
    display: block;
    margin-top: 1rem;
    color: #ffffff;
}

.tools-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 1rem;
}

.tool-card {
    background: rgba(0, 255, 136, 0.1);
    padding: 1rem;
    border-radius: 10px;
    text-align: center;
    transition: all 0.3s ease;
    color: #ffffff;
    border: 1px solid rgba(0, 255, 136, 0.3);
}

.tool-card:hover {
    transform: translateY(-5px);
    background: rgba(0, 255, 136, 0.2);
    border-color: var(--primary-color);
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
}

.tool-card i {
    font-size: 2rem;
    margin-bottom: 0.5rem;
    color: var(--primary-color);
}

/* Coding Profiles */
.coding-profiles-section {
    padding: 80px 0;
    background: transparent !important;
    position: relative;
    z-index: 1;
}

.profiles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 2rem;
}

.profile-card {
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 2rem;
    text-align: center;
    transition: all 0.3s ease;
    border: 1px solid rgba(0, 255, 136, 0.3);
}

.profile-card:hover {
    transform: translateY(-10px);
    border-color: var(--primary-color);
    box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
}

.profile-icon {
    font-size: 4rem;
    color: var(--primary-color);
    margin-bottom: 1rem;
    text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
}

.profile-card h3 {
    margin-bottom: 0.5rem;
    color: #ffffff;
}

.username {
    color: var(--text-secondary);
    margin-bottom: 1rem;
}

.profile-description {
    margin-bottom: 1.5rem;
    color: #ffffff;
}

.btn-visit {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
    color: #000000;
    padding: 0.5rem 1rem;
    border-radius: 20px;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
}

.btn-visit:hover {
    transform: translateX(5px);
    box-shadow: 0 0 25px rgba(0, 255, 136, 0.5);
}

/* Contact Section */
.contact-section {
    padding: 80px 0;
    background: transparent !important;
    position: relative;
    z-index: 1;
}

.contact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
}

.contact-info {
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 2rem;
    border: 1px solid rgba(0, 255, 136, 0.3);
}

.contact-info h3 {
    color: #ffffff;
    margin-bottom: 1rem;
}

.contact-info p {
    color: var(--text-secondary);
}

.info-item {
    display: flex;
    gap: 1rem;
    margin-bottom: 1.5rem;
    align-items: center;
}

.info-item i {
    font-size: 1.5rem;
    color: var(--primary-color);
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
}

.info-item h4 {
    margin-bottom: 0.2rem;
    color: #ffffff;
}

.info-item p {
    color: var(--text-secondary);
}

.social-links {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
}

.social-icon {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(0, 255, 136, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    text-decoration: none;
    transition: all 0.3s ease;
    border: 1px solid rgba(0, 255, 136, 0.3);
}

.social-icon:hover {
    background: var(--primary-color);
    color: #000000;
    transform: translateY(-5px);
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
}

.contact-form {
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 2rem;
    border: 1px solid rgba(0, 255, 136, 0.3);
}

.form-group {
    margin-bottom: 1rem;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 0.8rem;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(0, 255, 136, 0.3);
    border-radius: 10px;
    color: #ffffff;
    font-family: inherit;
    transition: all 0.3s ease;
}

.form-group input::placeholder,
.form-group textarea::placeholder {
    color: rgba(255, 255, 255, 0.5);
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: var(--primary-color);
    background: rgba(0, 0, 0, 0.8);
    box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
}

.btn-submit {
    width: 100%;
    padding: 1rem;
    background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
    color: #000000;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
}

.btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 25px rgba(0, 255, 136, 0.5);
}

/* About Section */
.about-section {
    padding: 80px 0;
    background: transparent !important;
    position: relative;
    z-index: 1;
}

.about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
    margin-bottom: 4rem;
}

.about-content h3 {
    color: #ffffff;
    margin-bottom: 1rem;
}

.about-content p {
    color: var(--text-secondary);
    margin-bottom: 1rem;
    line-height: 1.6;
}

.profile-img {
    width: 100%;
    border-radius: 15px;
    border: 3px solid var(--primary-color);
    box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
}

.timeline {
    position: relative;
    padding-left: 2rem;
}

.timeline-title {
    color: #ffffff;
    margin-bottom: 2rem;
}

.timeline::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
    box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
}

.timeline-item {
    position: relative;
    margin-bottom: 2rem;
    padding-left: 2rem;
}

.timeline-dot {
    position: absolute;
    left: -2.1rem;
    top: 0;
    width: 1rem;
    height: 1rem;
    border-radius: 50%;
    background: var(--primary-color);
    border: 2px solid var(--secondary-color);
    box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
}

.timeline-date {
    font-weight: 600;
    color: var(--primary-color);
    margin-bottom: 0.5rem;
}

.timeline-content {
    background: rgba(0, 0, 0, 0.7);
    padding: 1rem;
    border-radius: 10px;
    border: 1px solid rgba(0, 255, 136, 0.3);
}

.timeline-content h4 {
    color: #ffffff;
    margin-bottom: 0.5rem;
}

.timeline-content p {
    color: var(--text-secondary);
}

/* Alert Messages */
.alert {
    padding: 1rem;
    border-radius: 10px;
    margin-top: 1rem;
    animation: slideIn 0.5s ease;
}

@keyframes slideIn {
    from {
        transform: translateX(-100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

.alert-success {
    background: rgba(0, 255, 136, 0.2);
    border: 1px solid var(--primary-color);
    color: var(--primary-color);
}

.alert-error {
    background: rgba(255, 0, 102, 0.2);
    border: 1px solid var(--secondary-color);
    color: var(--secondary-color);
}

/* Animations */
@keyframes glow {
    0%, 100% {
        text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
    }
    50% {
        text-shadow: 0 0 40px rgba(0, 255, 136, 0.8);
    }
}

/* Scrollbar Styling */
::-webkit-scrollbar {
    width: 10px;
}

::-webkit-scrollbar-track {
    background: #000000;
}

::-webkit-scrollbar-thumb {
    background: var(--primary-color);
    border-radius: 5px;
    box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
}

::-webkit-scrollbar-thumb:hover {
    background: var(--secondary-color);
}

/* Responsive Design */



/* Ensure all content has proper z-index */
main, .page-content, .hero-section, .projects-section, 
.skills-section, .coding-profiles-section, .contact-section, 
.about-section {
    position: relative;
    z-index: 1;
}

/* Buttons - Different colors for each */
.cta-buttons {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
}

.btn {
    padding: 0.8rem 1.5rem;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}

/* Download Resume Button - Neon Green */
.btn-primary {
    background: linear-gradient(135deg, #00ff88, #00cc66);
    color: #000000;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    border: 1px solid rgba(0, 255, 136, 0.5);
}

.btn-primary:hover {
    background: linear-gradient(135deg, #00ff88, #00ff88);
    transform: translateY(-3px);
    box-shadow: 0 0 30px rgba(0, 255, 136, 0.8);
    color: #000000;
}

/* View Projects Button - Neon Blue */
.btn-secondary {
    background: linear-gradient(135deg, #00ff88, #00cc66);
    color: #000000;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    border: 1px solid rgba(0, 255, 136, 0.5);
}
.btn-secondary:hover {
    background: linear-gradient(135deg, #00ff88, #00cc66);
    color: #000000;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    border: 1px solid rgba(0, 255, 136, 0.5);
}
/* Contact Me Button - Neon Pink/Magenta */
.btn-tertiary {
    background: linear-gradient(135deg, #00ff88, #00cc66);
    color: #000000;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    border: 1px solid rgba(0, 255, 136, 0.5);
}

.btn-tertiary:hover {
    background: linear-gradient(135deg, #00ff88, #00cc66);
    color: #000000;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    border: 1px solid rgba(0, 255, 136, 0.5);
}

/* Button ripple effect */
.btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transform: translate(-50%, -50%);

        // Initialize AOS
AOS.init({
    duration: 1000,
    once: true,
    offset: 100
});

// Initialize Particles.js with enhanced visibility on black background
particlesJS('particles-js', {
    particles: {
        number: {
            value: 150,
            density: {
                enable: true,
                value_area: 800
            }
        },
        color: {
            value: '#00ff88'
        },
        shape: {
            type: 'circle',
            stroke: {
                width: 0,
                color: '#000000'
            },
            polygon: {
                nb_sides: 5
            }
        },
        opacity: {
            value: 0.8,
            random: true,
            anim: {
                enable: true,
                speed: 1,
                opacity_min: 0.4,
                sync: false
            }
        },
        size: {
            value: 3,
            random: true,
            anim: {
                enable: true,
                speed: 2,
                size_min: 1,
                sync: false
            }
        },
        line_linked: {
            enable: true,
            distance: 120,
            color: '#00ff88',
            opacity: 0.5,
            width: 1.5
        },
        move: {
            enable: true,
            speed: 2,
            direction: 'none',
            random: true,
            straight: false,
            out_mode: 'out',
            bounce: false,
            attract: {
                enable: true,
                rotateX: 600,
                rotateY: 1200
            }
        }
    },
    interactivity: {
        detect_on: 'canvas',
        events: {
            onhover: {
                enable: true,
                mode: 'repulse'
            },
            onclick: {
                enable: true,
                mode: 'push'
            },
            resize: true
        },
        modes: {
            grab: {
                distance: 400,
                line_linked: {
                    opacity: 1
                }
            },
            bubble: {
                distance: 400,
                size: 40,
                duration: 2,
                opacity: 8,
                speed: 3
            },
            repulse: {
                distance: 150,
                duration: 0.4
            },
            push: {
                particles_nb: 4
            },
            remove: {
                particles_nb: 2
            }
        }
    },
    retina_detect: true
});

// Add more green particles with connecting lines
setTimeout(() => {
    const pJSDom = window.pJSDom[0];
    if (pJSDom && pJSDom.particles) {
        // Add additional green particles
        for (let i = 0; i < 50; i++) {
            if (pJSDom.particles.array[0]) {
                pJSDom.particles.array.push({
                    ...pJSDom.particles.array[0],
                    color: { value: '#00ff88' },
                    position: {
                        x: Math.random() * window.innerWidth,
                        y: Math.random() * window.innerHeight
                    },
                    opacity: {
                        value: 0.7
                    }
                });
            }
        }
    }
}, 1000);



// Mobile Navigation Toggle
const burger = document.querySelector(".burger");
const navLinks = document.querySelector(".nav-links");

burger.addEventListener("click", () => {

    navLinks.classList.toggle("active");
    burger.classList.toggle("toggle");

    // Prevent background scrolling
    document.body.classList.toggle("menu-open");

});


// Smooth Page Transitions
document.querySelectorAll('.nav-links a').forEach(link => {
    link.addEventListener('click', function(e) {
        e.preventDefault();
        const href = this.getAttribute('href');
        
        const pageContent = document.querySelector('.page-content');
        if (pageContent) {
            pageContent.style.animation = 'fadeOut 0.3s ease';
        }
        
        setTimeout(() => {
            window.location.href = href;
        }, 300);
    });
});

// Scroll Animations with GSAP
gsap.registerPlugin(ScrollTrigger);

gsap.utils.toArray('.project-card, .skill-category, .profile-card').forEach(card => {
    gsap.from(card, {
        scrollTrigger: {
            trigger: card,
            start: 'top bottom+=100',
            toggleActions: 'play none none reverse'
        },
        opacity: 0,
        y: 50,
        duration: 0.8,
        ease: 'power2.out'
    });
});

// Progress Bar Animation
const progressBars = document.querySelectorAll('.progress');
progressBars.forEach(bar => {
    const width = bar.style.width;
    bar.style.width = '0';
    
    setTimeout(() => {
        bar.style.width = width;
    }, 500);
});

// Floating Elements Animation with random positions
const floatElements = document.querySelectorAll('.float-element');
floatElements.forEach((element, index) => {
    const delay = index * 0.2;
    element.style.animationDelay = `${delay}s`;
    
    // Random positions within viewport
    const randomX = 5 + Math.random() * 90;
    const randomY = 5 + Math.random() * 90;
    element.style.top = `${randomY}%`;
    element.style.left = `${randomX}%`;
    
    // Random animation duration
    const randomDuration = 6 + Math.random() * 6;
    element.style.animationDuration = `${randomDuration}s`;
    
    // Random size
    const randomSize = 1.5 + Math.random() * 1.5;
    element.style.fontSize = `${randomSize}rem`;
});

// Typing Animation for About Section
if (document.querySelector('.typing-about')) {
    new Typed('.typing-about', {
        strings: ['Problem Solver', 'Innovator', 'Team Player', 'Continuous Learner'],
        typeSpeed: 50,
        backSpeed: 30,
        loop: true
    });
}

// Add active class to current navigation link
const currentPath = window.location.pathname;
document.querySelectorAll('.nav-links a').forEach(link => {
    const href = link.getAttribute('href');
    if (href === currentPath || 
        (currentPath === '/' && href === '/') ||
        (currentPath === '/home' && href === '/')) {
        link.classList.add('active');
    }
});

// Form Validation and Animation
const contactForm = document.querySelector('form');
if (contactForm) {
    contactForm.addEventListener('submit', function(e) {
        const submitBtn = this.querySelector('.btn-submit');
        if (submitBtn) {
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            submitBtn.disabled = true;
        }
    });
}

// Smooth Scroll for Anchor Links
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
            target.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });
        }
    });
});

// Add CSS for animations
const style = document.createElement('style');
style.textContent = `
    @keyframes fadeOut {
        from {
            opacity: 1;
            transform: translateY(0);
        }
        to {
            opacity: 0;
            transform: translateY(-30px);
        }
    }
    
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
            opacity: 0.6;
        }
        50% {
            transform: scale(1.1);
            opacity: 1;
        }
    }
    
    .burger {
        display: none;
        cursor: pointer;
    }
    
    .burger div {
        width: 25px;
        height: 3px;
        background-color: white;
        margin: 5px;
        transition: all 0.3s ease;
    }
    
    @media (max-width: 768px) {
        .burger {
            display: block;
        }
        
        .burger.toggle .line1 {
            transform: rotate(-45deg) translate(-5px, 6px);
        }
        
        .burger.toggle .line2 {
            opacity: 0;
        }
        
        .burger.toggle .line3 {
            transform: rotate(45deg) translate(-5px, -6px);
        }
    }
    
    /* Particle canvas visibility */
    #particles-js canvas {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        z-index: 0 !important;
        background: #000000 !important;
    }
    
    /* Ensure content is above particles */
    .navbar, .hero-section, .projects-section, .skills-section, 
    .coding-profiles-section, .contact-section, .about-section {
        position: relative;
        z-index: 1;
    }
`;
document.head.appendChild(style);

// 3D Tilt Effect for Cards
document.querySelectorAll('.project-card, .profile-card, .tool-card').forEach(card => {
    card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        
        const rotateX = (y - centerY) / 20;
        const rotateY = (centerX - x) / 20;
        
        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-10px)`;
    });
    
    card.addEventListener('mouseleave', () => {
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0)';
    });
});

// Add floating particles effect with Three.js for additional green dots
const addThreeJSParticles = () => {
    const threeContainer = document.getElementById('three-canvas');
    if (threeContainer && !window.threeParticlesAdded) {
        window.threeParticlesAdded = true;
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        threeContainer.appendChild(renderer.domElement);
        
        // Create many small green particles
        const particleCount = 500;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesPositions = new Float32Array(particleCount * 3);
        
        for (let i = 0; i < particleCount; i++) {
            particlesPositions[i * 3] = (Math.random() - 0.5) * 200;
            particlesPositions[i * 3 + 1] = (Math.random() - 0.5) * 100;
            particlesPositions[i * 3 + 2] = (Math.random() - 0.5) * 50 - 20;
        }
        
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlesPositions, 3));
        
        const particlesMaterial = new THREE.PointsMaterial({
            color: 0x00ff88,
            size: 0.2,
            transparent: true,
            opacity: 0.6
        });
        
        const particlesSystem = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesSystem);
        
        camera.position.z = 30;
        
        function animateParticles() {
            requestAnimationFrame(animateParticles);
            particlesSystem.rotation.y += 0.002;
            particlesSystem.rotation.x += 0.001;
            renderer.render(scene, camera);
        }
        
        animateParticles();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }
};

// Call after a short delay to ensure DOM is ready
setTimeout(addThreeJSParticles, 500);

// Console greeting
console.log('%c🚀 Welcome to my portfolio!', 'color: #00ff88; font-size: 20px; font-weight: bold;');
console.log('%c✨ Green particles and connecting lines are active on black background!', 'color: #00ff88; font-size: 14px;');
console.log('%c💖 Feel free to explore my work and get in touch!', 'color: #ff0066; font-size: 14px;');

// Fetch skills from your API
fetch('/api/skills')
  .then(response => response.json())
  .then(skills => {
    const skillsList = document.querySelector('.skills-list');
    skillsList.innerHTML = skills.map(skill => 
      `<div class="skill-item">
        <span>${skill.name}</span>
        <div class="progress-bar" style="width: ${skill.percentage}%"></div>
      </div>`
    ).join('');
});
